[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decodehub"
version = "0.1.0"
description = "统一采集数据归一化 + 通信协议解码 + 可视化 的 MCP 平台（逻辑分析仪 / 示波器 / MCU ADC）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "mcp>=1.29,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
decodehub-mcp = "decodehub.mcp_server.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
